name: Build luci-app-homeproxy (patched multi-arch)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'root/**'
      - 'htdocs/**'
      - 'po/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  PACKAGE_VERSION: '26.071.13677~ec92da1'

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_dir: openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64
            target_cfg: CONFIG_TARGET_x86=y
            subtarget_cfg: CONFIG_TARGET_x86_64=y
          - arch: aarch64
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_dir: openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64
            target_cfg: CONFIG_TARGET_armsr=y
            subtarget_cfg: CONFIG_TARGET_armsr_armv8=y

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache ecj fastjar file gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync subversion unzip wget xsltproc zip zlib1g-dev zstd

      - name: Download and unpack SDK (${{ matrix.arch }})
        run: |
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar.zst
          tar -xf sdk.tar.zst
          mv "${{ matrix.sdk_dir }}" "$HOME/openwrt"
          rm -f sdk.tar.zst

      - name: Add feeds
        run: |
          cd "$HOME/openwrt"
          grep -q immortalwrt_pkgs feeds.conf.default || \
            echo "src-git immortalwrt_pkgs https://github.com/immortalwrt/packages.git;openwrt-25.12" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy patched package into SDK
        run: |
          mkdir -p "$HOME/openwrt/package/custom"
          rm -rf "$HOME/openwrt/package/custom/homeproxy"
          cp -a "$GITHUB_WORKSPACE/src" "$HOME/openwrt/package/custom/homeproxy"
          rm -rf "$HOME/openwrt/package/custom/homeproxy/.git" \
                 "$HOME/openwrt/package/custom/homeproxy/.github"

      - name: Configure
        run: |
          cd "$HOME/openwrt"
          {
            echo "${{ matrix.target_cfg }}"
            echo "${{ matrix.subtarget_cfg }}"
            echo "CONFIG_PACKAGE_luci-app-homeproxy=y"
            echo "CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y"
            echo "CONFIG_ALL_NONSHARED=n"
            echo "CONFIG_SIGNED_PACKAGES=n"
            echo "CONFIG_SIGNATURE_CHECK=n"
          } > .config
          make defconfig

      - name: Compile
        run: |
          cd "$HOME/openwrt"
          make package/custom/homeproxy/luci-app-homeproxy/compile V=s -j"$(nproc)" || \
          make package/custom/homeproxy/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$HOME/openwrt/bin/packages/" -type f -name "*homeproxy*.apk" \
            -exec cp -f {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/output"
          echo "=== collected ==="
          ls -lh
          for f in *.apk; do
            [ -f "$f" ] || continue
            mv -f "$f" "${f%.apk}_${{ matrix.arch }}.apk"
          done
          echo "=== renamed (arch-suffixed) ==="
          ls -lh
          test -n "$(ls -A *.apk 2>/dev/null)" || { echo "::error::no apk produced"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: ${{ github.workspace }}/output/*.apk
          if-no-files-found: error

      - name: Cleanup SDK
        if: always()
        run: rm -rf "$HOME/openwrt" || true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## luci-app-homeproxy (patched) v${{ env.PACKAGE_VERSION }}"
            echo ""
            echo "- **Firmware:** OpenWrt 25.12.2"
            echo "- **Arch:** x86_64 / aarch64"
            echo "- **改动:** 自动提取订阅链接内嵌证书（tls_certificate / cert / pinSHA256），保持 tls_insecure=0，无需 insecure。"
            echo ""
            echo "### 安装"
            echo '```bash'
            for f in dist/*.apk; do
              echo "apk add --allow-untrusted /tmp/$(basename "$f")"
            done
            echo "rm -f /tmp/luci-indexcache.*"
            echo "/etc/init.d/rpcd reload"
            echo '```'
          } > /tmp/body.md
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --title "luci-app-homeproxy (patched) v${{ env.PACKAGE_VERSION }}" \
            --notes-file /tmp/body.md \
            --repo "${{ github.repository }}" \
            -- dist/*.apk

      - name: Cleanup old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 10
          delete_tags: true
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
