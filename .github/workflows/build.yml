name: Build luci-app-homeproxy (patched, noarch)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'root/**'
      - 'htdocs/**'
      - 'po/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  # luci-app-homeproxy 的元数据是 arch: noarch（源自 Makefile 里 LUCI_PKGARCH:=all），
  # 一个包即可装到任意架构，因此只需用一个 SDK 编译一次。
  SDK_URL: https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_DIR: openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64

jobs:
  build:
    name: Build noarch package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Ensure disk space
        run: |
          df -h /
          free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "可用空间: $((free_kb / 1024 / 1024)) GiB"
          if [ "$free_kb" -lt 20971520 ]; then
            echo "::warning::可用空间不足 20 GiB，清理 runner 预装 SDK 以留出余量"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          else
            echo "空间充足，跳过清理（省下约 1.5 分钟）"
          fi
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache cmake ecj fastjar file gawk gettext git \
            libelf-dev libjson-c-dev libncurses5-dev libncursesw5-dev libpcre2-dev libssl-dev \
            python3 python3-pip python3-setuptools rsync subversion unzip wget xsltproc zip \
            zlib1g-dev zstd

      - name: Cache ucode syntax checker
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ucode-bin
          key: ucode-syntax-checker-${{ runner.os }}-v1

      - name: Validate ucode syntax of patched scripts
        run: |
          set -uo pipefail

          UCODE_BIN="$RUNNER_TEMP/ucode-bin/ucode"

          if [ ! -x "$UCODE_BIN" ]; then
            echo "::group::首次运行：编译 ucode 语法检查器（之后走缓存，约 10 秒）"
            git clone --depth 1 https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode-src"
            cmake -S "$RUNNER_TEMP/ucode-src" -B "$RUNNER_TEMP/ucode-build" -DCMAKE_BUILD_TYPE=Release >/dev/null
            cmake --build "$RUNNER_TEMP/ucode-build" -j"$(nproc)" >/dev/null
            mkdir -p "$RUNNER_TEMP/ucode-bin"
            cp "$RUNNER_TEMP/ucode-build/ucode" "$UCODE_BIN"
            echo "::endgroup::"
          else
            echo "ucode 语法检查器来自缓存"
          fi

          if ! "$UCODE_BIN" -e 'exit(0)'; then
            echo "::warning::ucode 不可用，跳过语法检查（不阻塞构建）"
            exit 0
          fi

          # luci.mk 只把 root/ 下的 .uc 原样拷进包、不做语法编译，
          # 语法错误会静默出厂并让路由器上的订阅更新直接失败 —— 这里显式校验
          fail=0
          for f in src/root/etc/homeproxy/scripts/*.uc; do
            # 剥离 luci.* 模块 import：构建环境没有 LuCI 模块，仅影响本地解析
            sed -E "s#^import .* from 'luci\.[^']*';\$##" "$f" > "$RUNNER_TEMP/chk.uc"
            if "$UCODE_BIN" -c "$RUNNER_TEMP/chk.uc"; then
              echo "OK   $f"
            else
              echo "::error::ucode 语法错误：$f"
              fail=1
            fi
          done

          exit $fail

      - name: Download and unpack SDK
        run: |
          wget -q "${{ env.SDK_URL }}" -O sdk.tar.zst
          tar -xf sdk.tar.zst
          mv "${{ env.SDK_DIR }}" "$HOME/openwrt"
          rm -f sdk.tar.zst

      - name: Add feeds
        run: |
          cd "$HOME/openwrt"
          grep -q immortalwrt_pkgs feeds.conf.default || \
            echo "src-git immortalwrt_pkgs https://github.com/immortalwrt/packages.git;openwrt-25.12" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy patched package into SDK
        run: |
          mkdir -p "$HOME/openwrt/package/custom"
          rm -rf "$HOME/openwrt/package/custom/homeproxy"
          cp -a "$GITHUB_WORKSPACE/src" "$HOME/openwrt/package/custom/homeproxy"
          rm -rf "$HOME/openwrt/package/custom/homeproxy/.git" \
                 "$HOME/openwrt/package/custom/homeproxy/.github"

      - name: Configure
        run: |
          cd "$HOME/openwrt"
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_PACKAGE_luci-app-homeproxy=y"
            echo "CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y"
            echo "CONFIG_ALL_NONSHARED=n"
            echo "CONFIG_SIGNED_PACKAGES=n"
            echo "CONFIG_SIGNATURE_CHECK=n"
          } > .config
          make defconfig

      - name: Compile
        run: |
          cd "$HOME/openwrt"
          make package/custom/homeproxy/luci-app-homeproxy/compile V=s -j"$(nproc)" || \
          make package/custom/homeproxy/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$HOME/openwrt/bin/packages/" -type f -name "*homeproxy*.apk" \
            -exec cp -f {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/output"/
          test -n "$(ls -A "$GITHUB_WORKSPACE/output"/*.apk 2>/dev/null)" \
            || { echo "::error::no apk produced"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-noarch
          path: ${{ github.workspace }}/output/*.apk
          if-no-files-found: error

      - name: Cleanup SDK
        if: always()
        run: rm -rf "$HOME/openwrt" || true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## luci-app-homeproxy (patched) · noarch"
            echo ""
            echo "- **Firmware:** OpenWrt 25.12.2"
            echo "- **包架构:** \`noarch\`（源自 \`LUCI_PKGARCH:=all\`），一个包通吃 x86_64 / aarch64 / 其它架构"
            echo "- **改动:** 自动提取订阅链接内嵌证书（tls_certificate / cert / pinSHA256），保持 tls_insecure=0，无需 insecure"
            echo ""
            echo "### 安装"
            echo '```bash'
            for f in dist/*.apk; do
              echo "apk add --allow-untrusted /tmp/$(basename "$f")"
            done
            echo "rm -f /tmp/luci-indexcache.*"
            echo "/etc/init.d/rpcd reload"
            echo '```'
          } > /tmp/body.md
          # 本 job 无 checkout，gh 无法从 git remote 推断仓库，必须显式 --repo
          gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" \
            || echo "::notice::没有同名 release 需要删除"
          gh release create "${{ github.ref_name }}" \
            --title "luci-app-homeproxy (patched) · noarch · #${{ github.run_number }}" \
            --notes-file /tmp/body.md \
            --repo "${{ github.repository }}" \
            -- dist/*.apk

      - name: Cleanup old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 10
          delete_tags: true
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
