name: Build luci-app-homeproxy (patched, noarch)
on:
  workflow_dispatch:
    inputs:
      firmware:
        description: '要编译的目标固件（25.12 出 apk / 24.10 出 ipk / both 两者都出）'
        type: choice
        required: true
        default: both
        options:
          - both
          - '25.12'
          - '24.10'
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'root/**'
      - 'htdocs/**'
      - 'po/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  # 手动触发时按选择只编一种；push 触发时两种都编。
  # 注意：matrix 上下文不能用在 job 级 if: 上，所以这里用 prepare 动态生成 matrix。
  prepare:
    name: Resolve build targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Resolve targets
        id: targets
        env:
          TARGET: ${{ inputs.firmware || 'both' }}
        run: |
          set -euo pipefail

          # luci-app-homeproxy 的元数据是 arch: noarch / all（源自 Makefile 里 LUCI_PKGARCH:=all），
          # 一个包即可装到任意架构，因此每种格式只需用一个 SDK 编译一次。
          cat > /tmp/apk.json <<'JSON'
          {"name":"apk","fw":"25.12","ext":"apk","artifact":"apk-noarch","feeds_branch":"openwrt-25.12","sdk_url":"https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst","sdk_dir":"openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64"}
          JSON
          cat > /tmp/ipk.json <<'JSON'
          {"name":"ipk","fw":"24.10","ext":"ipk","artifact":"ipk-noarch","feeds_branch":"openwrt-24.10","sdk_url":"https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst","sdk_dir":"openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64"}
          JSON

          case "$TARGET" in
            '25.12'|apk) matrix="{\"pkg\":[$(cat /tmp/apk.json)]}" ;;
            '24.10'|ipk) matrix="{\"pkg\":[$(cat /tmp/ipk.json)]}" ;;
            both|'')     matrix="{\"pkg\":[$(cat /tmp/apk.json),$(cat /tmp/ipk.json)]}" ;;
            *) echo "::error::未知的 firmware 输入：$TARGET"; exit 1 ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGET" >> "$GITHUB_OUTPUT"
          echo "本次编译目标：$TARGET"
          echo "$matrix"

  build:
    name: Build noarch package (${{ matrix.pkg.name }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Normalize source mtime to commit time
        run: |
          # luci.mk 在包目录里没有 .git 时，用「包目录中最新文件的 mtime」推导版本号（0.YYMMDD.当天秒数）。
          # 两条腿各自 checkout，时间不同会让 apk / ipk 版本号差几秒；这里统一按 commit 时间：
          # 同一 commit 的两种格式版本号完全一致，且重跑同一 commit 版本号不变（release 才能对齐）。
          ts="$(git -C src log -1 --format=%ct 2>/dev/null || true)"
          if [ -z "$ts" ]; then
            echo "::warning::拿不到 commit 时间，回退为当前时间"
            ts="$(date -u +%s)"
          fi
          stamp="$(date -u -d "@$ts" '+%Y-%m-%dT%H:%M:%SZ')"
          find src -type f -not -path 'src/.git/*' -exec touch -d "$stamp" {} +
          echo "版本基准时间: $stamp"

      - name: Ensure disk space
        run: |
          df -h /
          free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "可用空间: $((free_kb / 1024 / 1024)) GiB"
          if [ "$free_kb" -lt 20971520 ]; then
            echo "::warning::可用空间不足 20 GiB，清理 runner 预装 SDK 以留出余量"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          else
            echo "空间充足，跳过清理（省下约 1.5 分钟）"
          fi
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache cmake ecj fastjar file gawk gettext git \
            libelf-dev libjson-c-dev libncurses5-dev libncursesw5-dev libpcre2-dev libssl-dev \
            python3 python3-pip python3-setuptools rsync subversion unzip wget xsltproc zip \
            zlib1g-dev zstd

      - name: Cache ucode syntax checker
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ucode-bin
          key: ucode-syntax-checker-${{ runner.os }}-v2

      - name: Validate ucode syntax of patched scripts
        run: |
          set -uo pipefail

          UCODE_BIN="$RUNNER_TEMP/ucode-bin/ucode"

          if [ ! -x "$UCODE_BIN" ]; then
            echo "::group::首次运行：编译 ucode 语法检查器（之后走缓存，约 10 秒）"
            git clone --depth 1 https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode-src"
            cmake -S "$RUNNER_TEMP/ucode-src" -B "$RUNNER_TEMP/ucode-build" -DCMAKE_BUILD_TYPE=Release >/dev/null
            cmake --build "$RUNNER_TEMP/ucode-build" -j"$(nproc)" >/dev/null
            mkdir -p "$RUNNER_TEMP/ucode-bin"
            cp "$RUNNER_TEMP/ucode-build/ucode" "$UCODE_BIN"
            echo "::endgroup::"
          else
            echo "ucode 语法检查器来自缓存"
          fi

          # ucode 模块（fs 等）随二进制一起放进缓存目录，供后续校验脚本用；
          # 只缓存 ucode-bin 一个目录，缓存命中时 ucode-build 是不存在的。
          if [ ! -d "$RUNNER_TEMP/ucode-bin/lib" ] && [ -d "$RUNNER_TEMP/ucode-build" ]; then
            mkdir -p "$RUNNER_TEMP/ucode-bin/lib"
            ( cd "$RUNNER_TEMP/ucode-build" && find . -name '*.so' -exec cp -f {} "$RUNNER_TEMP/ucode-bin/lib/" \; ) || true
          fi
          ls "$RUNNER_TEMP/ucode-bin/lib" 2>/dev/null | head -5 || true

          if ! "$UCODE_BIN" -e 'exit(0)'; then
            echo "::warning::ucode 不可用，跳过语法检查（不阻塞构建）"
            exit 0
          fi

          # luci.mk 只把 root/ 下的 .uc 原样拷进包、不做语法编译，
          # 语法错误会静默出厂并让路由器上的订阅更新直接失败 —— 这里显式校验
          fail=0
          for f in src/root/etc/homeproxy/scripts/*.uc; do
            # 剥离全部 import（裸 ucode 解析不了 luci / uci / ubus / homeproxy 模块）
            python3 src/.github/scripts/ucode-strip-imports.py "$f" "$RUNNER_TEMP/chk.uc"
            if "$UCODE_BIN" -c "$RUNNER_TEMP/chk.uc"; then
              echo "OK   $f"
            else
              echo "::error::ucode 语法错误：$f"
              fail=1
            fi
          done

          exit $fail

      - name: Verify certificate cleanup logic on real ucode
        run: |
          set -uo pipefail

          UCODE_BIN="$RUNNER_TEMP/ucode-bin/ucode"

          if [ ! -x "$UCODE_BIN" ]; then
            echo "::warning::ucode 不可用，跳过清理逻辑校验（不阻塞构建）"
            exit 0
          fi

          # 模块目录与二进制同在缓存目录（见上一步），不再用 find 探测
          MODDIR="$RUNNER_TEMP/ucode-bin/lib"

          if [ ! -d "$MODDIR" ]; then
            echo "::warning::未找到 ucode 模块目录，跳过清理逻辑校验（不阻塞构建）"
            exit 0
          fi

          echo "ucode 模块目录: $MODDIR"
          "$UCODE_BIN" -L "$MODDIR" src/.github/scripts/check-orphan-cleanup.uc

      - name: Download and unpack SDK
        run: |
          wget -q "${{ matrix.pkg.sdk_url }}" -O sdk.tar.zst
          tar -xf sdk.tar.zst
          mv "${{ matrix.pkg.sdk_dir }}" "$HOME/openwrt"
          rm -f sdk.tar.zst

      - name: Add feeds
        run: |
          cd "$HOME/openwrt"
          grep -q immortalwrt_pkgs feeds.conf.default || \
            echo "src-git immortalwrt_pkgs https://github.com/immortalwrt/packages.git;${{ matrix.pkg.feeds_branch }}" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy patched package into SDK
        run: |
          mkdir -p "$HOME/openwrt/package/custom"
          rm -rf "$HOME/openwrt/package/custom/homeproxy"
          cp -a "$GITHUB_WORKSPACE/src" "$HOME/openwrt/package/custom/homeproxy"
          rm -rf "$HOME/openwrt/package/custom/homeproxy/.git" \
                 "$HOME/openwrt/package/custom/homeproxy/.github"

      - name: Configure
        run: |
          cd "$HOME/openwrt"
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_PACKAGE_luci-app-homeproxy=y"
            echo "CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y"
            echo "CONFIG_ALL_NONSHARED=n"
            echo "CONFIG_SIGNED_PACKAGES=n"
            echo "CONFIG_SIGNATURE_CHECK=n"
          } > .config
          make defconfig

      - name: Compile
        run: |
          cd "$HOME/openwrt"
          make package/custom/homeproxy/luci-app-homeproxy/compile V=s -j"$(nproc)" || \
          make package/custom/homeproxy/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$HOME/openwrt/bin/packages/" -type f -name "*homeproxy*.${{ matrix.pkg.ext }}" \
            -exec cp -f {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/output"/
          test -n "$(ls -A "$GITHUB_WORKSPACE/output"/*.${{ matrix.pkg.ext }} 2>/dev/null)" \
            || { echo "::error::no ${{ matrix.pkg.ext }} produced"; exit 1; }
          # ipk 是 opkg 包，把 CONTROL 元数据打出来，方便确认 Architecture: all 与依赖
          if [ "${{ matrix.pkg.ext }}" = "ipk" ]; then
            for f in "$GITHUB_WORKSPACE/output"/*.ipk; do
              echo "--- $(basename "$f") ---"
              tar -xzOf "$f" ./control.tar.gz 2>/dev/null | tar -xzO ./control 2>/dev/null \
                || tar -xzOf "$f" ./CONTROL/control 2>/dev/null || true
            done
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg.artifact }}
          path: ${{ github.workspace }}/output/*.${{ matrix.pkg.ext }}
          if-no-files-found: error

      - name: Cleanup SDK
        if: always()
        run: rm -rf "$HOME/openwrt" || true

  release:
    name: Publish release
    needs: [prepare, build]
    # 任一条腿失败则不发布；否则正常发布（本次没编的格式不受影响）
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -lh dist
          test -n "$(ls -A dist)" || { echo "::error::没有拿到任何产物"; exit 1; }

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          apk_ver=""; ipk_ver=""
          for f in dist/luci-app-homeproxy-*.apk; do
            [ -e "$f" ] || continue
            apk_ver="$(basename "$f" | sed -n 's/^luci-app-homeproxy-\(.*\)\.apk$/\1/p')"
          done
          for f in dist/luci-app-homeproxy_*_all.ipk; do
            [ -e "$f" ] || continue
            ipk_ver="$(basename "$f" | sed -n 's/^luci-app-homeproxy_\(.*\)_all\.ipk$/\1/p')"
          done
          echo "apk 版本: ${apk_ver:-（本次未编译）}"
          echo "ipk 版本: ${ipk_ver:-（本次未编译）}"

          if [ -n "$apk_ver" ] && [ -n "$ipk_ver" ] && [ "$apk_ver" != "$ipk_ver" ]; then
            echo "::warning::apk 与 ipk 版本号不一致（$apk_ver / $ipk_ver），发布时取较大者"
            ver="$(printf '%s\n%s\n' "$apk_ver" "$ipk_ver" | sort -V | tail -1)"
          else
            ver="${apk_ver:-$ipk_ver}"
          fi
          if [ -z "$ver" ]; then
            ver="run-${GITHUB_RUN_NUMBER}"
            echo "::warning::无法从产物名解析出版本号，回退为 $ver"
          fi

          # tag 带上 commit 短号，保证不同提交绝不撞到同一个 release
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $ver"

      - name: Build release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## luci-app-homeproxy (patched) · noarch"
            echo ""
            echo "- **版本:** \`$VERSION\`"
            echo "- **对应提交:** \`${GITHUB_SHA}\`"
            echo "- **包架构:** \`noarch\`（apk）/ \`all\`（ipk），源自 \`LUCI_PKGARCH:=all\`，一个包通吃 x86_64 / aarch64 / 其它架构"
            echo "- **改动:** 自动提取订阅链接内嵌证书（tls_certificate / cert / pinSHA256），保持 tls_insecure=0，无需 insecure"
            echo ""
            if ls dist/*.apk >/dev/null 2>&1; then
              echo "### OpenWrt 25.12+（apk）"
              echo ""
              echo '```bash'
              for f in dist/*.apk; do
                echo "apk add --allow-untrusted /tmp/$(basename "$f")"
              done
              echo '```'
              echo ""
            fi
            if ls dist/*.ipk >/dev/null 2>&1; then
              echo "### OpenWrt 24.10（opkg / ipk）"
              echo ""
              echo '```bash'
              for f in dist/*.ipk; do
                echo "opkg install /tmp/$(basename "$f")"
              done
              echo '```'
              echo ""
            fi
            echo "装完清一下 LuCI 缓存："
            echo ""
            echo '```bash'
            echo "rm -f /tmp/luci-indexcache.*"
            echo "/etc/init.d/rpcd reload"
            echo '```'
          } > /tmp/body.md
          cat /tmp/body.md

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # 一个版本一个独立 release，已有 release 绝不删除重建；
          # tag 已存在说明是同一提交重跑或补编另一种格式，只补充/覆盖本次编出来的资产。
          # 本 job 无 checkout，gh 无法从 git remote 推断仓库，必须显式 --repo
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::release $TAG 已存在（同一提交重跑或补编另一种格式），只更新资产"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "luci-app-homeproxy (patched) · noarch · $VERSION" \
              --notes-file /tmp/body.md
          fi
          gh release edit "$TAG" --repo "$REPO" \
            --title "luci-app-homeproxy (patched) · noarch · $VERSION" \
            --notes-file /tmp/body.md

          gh release upload "$TAG" --repo "$REPO" --clobber dist/*

      - name: Keep only the latest 2 releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # 保留最新 2 个 release（当前版本 + 1 个历史版本），更早的连同 tag 一起删掉
          gh release list --repo "$REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' > /tmp/old-tags.txt
          if [ -s /tmp/old-tags.txt ]; then
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除历史 release: $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            done < /tmp/old-tags.txt
          else
            echo "release 总数不超过 2 个，无需清理"
          fi
          echo "当前 release："
          gh release list --repo "$REPO"
